# Reglas de lint exigidas en CI (ruff fijado en .github/workflows/ci.yml).
target-version = "py312"
line-length = 140

[lint]
# Errores reales (pyflakes/pycodestyle), bugbear y orden de imports.
select = ["E4", "E7", "E9", "F", "B", "I"]
# B008: Depends()/Query() en valores por defecto es el patrón de FastAPI.
ignore = ["B008"]
