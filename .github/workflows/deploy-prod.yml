name: Deploy to Production (manual gate)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable image version, e.g. v6.0.1
        required: true
        type: string
      confirm:
        description: Type DEPLOY to request production deployment
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit confirmation and image version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$DEPLOY_CONFIRM" != "DEPLOY" ]]; then
            echo "Confirmation failed. Type DEPLOY to proceed." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid immutable release version." >&2
            exit 1
          fi

  deploy:
    name: Rolling Deploy to Production
    needs: validate
    if: ${{ vars.PRODUCTION_RELEASE_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PRODUCTION_CORE_URL: ${{ secrets.PRODUCTION_CORE_URL }}
      ALLOW_PRODUCTION_SMOKE_TEST: "YES"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name zu-prod --region us-east-1

      - name: Update images to the requested immutable version
        run: |
          for svc in core ai documents media mail notifications autopilot attention onboarding billing sla drone; do
            kubectl set image deployment/zu-$svc "$svc=ghcr.io/${{ github.repository_owner }}/zu-$svc:$RELEASE_VERSION" -n zu-system
          done

      - name: Wait for rollout
        run: |
          for svc in core ai documents media mail notifications autopilot attention onboarding billing sla drone; do
            kubectl rollout status deployment/zu-$svc -n zu-system --timeout=600s
          done

      - name: Run verified Core smoke test
        run: ./scripts/smoke-test.sh production

      - name: Notify deployment
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_DEPLOYS_CHANNEL }}
          slack-message: "ZU ${{ inputs.version }} deployment — ${{ job.status }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
