name: Deploy to Staging (manual gate)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY_STAGING to deploy the selected workflow ref
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit staging confirmation
        env:
          DEPLOY_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [[ "$DEPLOY_CONFIRM" != "DEPLOY_STAGING" ]]; then
            echo "Confirmation failed. Type DEPLOY_STAGING to proceed." >&2
            exit 1
          fi

  deploy:
    name: Deploy selected ref to Staging
    needs: validate
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name zu-staging --region us-east-1

      - name: Apply staging manifests
        run: kubectl apply -k infra/kubernetes/overlays/staging

      - name: Wait for rollout
        run: |
          for svc in core ai documents media mail notifications autopilot attention onboarding billing sla drone; do
            kubectl rollout status deployment/zu-$svc -n zu-system --timeout=300s
          done

      - name: Run verified Core smoke test
        env:
          STAGING_CORE_URL: ${{ secrets.STAGING_CORE_URL }}
        run: ./scripts/smoke-test.sh staging
