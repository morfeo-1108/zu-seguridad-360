x-vault-env: &vault-env
  # Staging/producción: todo secreto se lee de Vault al arrancar (scripts/vault.sh,
  # scripts/provision-service.sh). El token de cada servicio llega como Docker secret.
  ENV: production
  VAULT_ENABLED: "true"
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN_FILE: /run/secrets/vault_token

networks:
  zu-network:
    driver: bridge

volumes:
  postgres_synthetic_data:
  redis_data:
  rabbitmq_data:
  weaviate_data:
  vault_data:
  minio_data:
  pg_certs:
  redis_acl:

services:
  # ─── BASES DE DATOS ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zu-postgres
    environment:
      POSTGRES_USER: zuadmin
      POSTGRES_PASSWORD: zupassword
      POSTGRES_DB: zu_core_synthetic
    ports:
      - "127.0.0.1:55432:5432"
    # SSL habilitado (requerido por ValidateProduction en staging/prod,
    # DB_SSLMODE=require) — self-signed, basta para cifrar el canal en
    # un único host; no fuerza SSL en clientes que sigan con
    # sslmode=disable (billing/attention/media siguen igual). Cert/key
    # generados una sola vez en el volumen pg_certs, ver instrucciones
    # de despliegue — nunca se commitean.
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    volumes:
      - postgres_synthetic_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_certs:/certs:ro
    networks: [zu-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zuadmin -d zu_core_synthetic"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zu-redis
    # aclfile en vez de --requirepass — un usuario creado con "ACL SETUSER"
    # por redis-cli vive solo en memoria y se pierde en el próximo
    # restart/reinicio del host (confirmado antes de aplicarlo: Redis no
    # tiene dónde persistirlo sin un aclfile configurado). El archivo
    # (users.acl, en el volumen redis_acl) lo puebla un paso de setup
    # único — ver instrucciones de despliegue — con la MISMA contraseña
    # de "default" que ya usan billing/attention/media, más el usuario
    # dedicado de Core. Nunca se commitea (vive solo en el volumen).
    command: redis-server --aclfile /etc/redis/users.acl --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_acl:/etc/redis
      - redis_data:/data
    networks: [zu-network]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zurabbit
      RABBITMQ_DEFAULT_PASS: zurabbit123
      RABBITMQ_DEFAULT_VHOST: zu_vhost
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [zu-network]
    restart: unless-stopped

  # ─── VECTOR DB ───────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.24.4
    container_name: zu-weaviate
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    # Vectores calculados por services/ai (embeddings locales en CPU); sin módulos
    # de terceros. Acceso solo con API key (secrets/weaviate.env, también en Vault
    # como weaviate_api_key del servicio ai).
    env_file: ./secrets/weaviate.env
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks: [zu-network]
    restart: unless-stopped

  # ─── KNOWLEDGE GRAPH ─────────────────────────────────────
  neo4j:
    image: neo4j:5.18-community
    container_name: zu-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/zuneo4j123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    networks: [zu-network]

  # ─── MQTT BROKER (DRONES) ────────────────────────────────
  emqx:
    image: emqx:5.5.0
    container_name: zu-emqx
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: zuemqx123
    networks: [zu-network]

  # ─── OBJECT STORAGE (S3 local) ───────────────────────────
  minio:
    # MinIO Inc. cerró el pull anónimo de quay.io/minio/minio y
    # minio/minio (Docker Hub) en septiembre 2026 (archivaron la edición
    # community) — confirmado en vivo, 401 Unauthorized en ambos
    # registros sin importar el tag. cgr.dev/chainguard/minio es el
    # mismo MinIO open-source, empaquetado por Chainguard, verificado
    # en vivo: arranca con los mismos args/env (server /data
    # --console-address ":9001", MINIO_ROOT_USER/PASSWORD) y responde
    # 200 en /minio/health/live.
    image: cgr.dev/chainguard/minio:latest
    container_name: zu-minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    # Root rotado (antes zuadmin/zupassword123): secrets/minio.env, copia en Vault
    # secret/zu360/minio-root. Los servicios usan usuarios propios (media: zu-media,
    # política limitada a zu-documents-local), nunca root.
    env_file: ./secrets/minio.env
    volumes:
      - minio_data:/data
    networks: [zu-network]
    restart: unless-stopped

  # ─── API GATEWAY ─────────────────────────────────────────
  kong:
    image: kong:3.6-ubuntu
    container_name: zu-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "127.0.0.1:80:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./infra/kong:/kong/declarative
    networks: [zu-network]
    depends_on: [core, mail, notifications]

  # ─── SECRETS ─────────────────────────────────────────────
  vault:
    # Modo servidor con almacenamiento persistente (no "dev": ese modo guarda todo
    # en memoria y usa un token raíz fijo). Arranca sellado; scripts/vault-unseal.sh.
    image: hashicorp/vault:1.16
    container_name: zu-vault
    cap_add: [IPC_LOCK]
    command: ["server", "-config=/zu/vault/config.hcl"]
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - vault_data:/vault/file
      - ./infra/vault:/zu/vault:ro
    networks: [zu-network]
    restart: unless-stopped

  mailpit:
    # Servidor SMTP de captura para staging: los correos llegan de verdad por SMTP
    # pero no salen a Internet. Se reemplaza por el proveedor real (SMTP_HOST) sin
    # cambiar código. Bandeja web solo en 127.0.0.1:8025.
    image: axllent/mailpit:v1.20
    container_name: zu-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks: [zu-network]
    restart: unless-stopped

  # ─── OBSERVABILIDAD ──────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: zu-grafana
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: zugrafana123
    networks: [zu-network]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: zu-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    networks: [zu-network]

  loki:
    image: grafana/loki:2.9.6
    container_name: zu-loki
    ports:
      - "127.0.0.1:3200:3100"
    networks: [zu-network]

  # ─── MICROSERVICIOS ──────────────────────────────────────
  core:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: zu-core
    ports:
      - "127.0.0.1:4001:4001"
    env_file:
      - ./services/core/.env.dev
      # Solo valores NO secretos propios del host (REDIS_USERNAME). Los
      # secretos vienen de Vault (secret/zu360/core). Opcional para dev/CI.
      - path: ./services/core/.env
        required: false
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/core
      AUTO_MIGRATE: "false"
      PILOT_SYNTHETIC_ENABLED: "false"
      GOOGLE_SIGNUP_ENABLED: "true"
      GOOGLE_CLIENT_ID: "1001223272587-0to05689t2m98rdtepul9fjiuv339ovo.apps.googleusercontent.com"
      GOOGLE_SIGNUP_TERMS_URL: "https://www.zuseguridad360.com/legal/terminos"
      GOOGLE_SIGNUP_PRIVACY_URL: "https://www.zuseguridad360.com/legal/privacidad"
      GOOGLE_SIGNUP_TERMS_VERSION: "1.0-piloto"
      GOOGLE_SIGNUP_PRIVACY_VERSION: "1.0-piloto"
      ALLOWED_ORIGINS: "https://www.zuseguridad360.com"
      DB_HOST: "postgres"
      DB_USER: "zu_core_staging"
      DB_NAME: "zu_core"
      DB_SSLMODE: "require"
    secrets:
      - source: vault_token_core
        target: vault_token
    depends_on:
      postgres:
        condition: service_healthy
    networks: [zu-network]
    restart: unless-stopped

  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: zu-ai
    ports:
      - "127.0.0.1:4002:4002"
    env_file: ./services/ai/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/ai
      AI_SERVICE_API_ENABLED: "true"
      AI_AUTONOMOUS_ENABLED: "false"
      VISION_ENABLED: "false"
      BIOMETRIC_ENABLED: "false"
      SENSITIVE_AI_ENABLED: "false"
      PRIVACY_PROCESSING_APPROVED: "false"
      WEAVIATE_URL: "http://weaviate:8080"
    secrets:
      - source: vault_token_ai
        target: vault_token
    depends_on: [postgres, weaviate, rabbitmq, vault]
    networks: [zu-network]
    restart: unless-stopped

  documents:
    build:
      context: ./services/documents
      dockerfile: Dockerfile
    container_name: zu-documents
    ports:
      - "127.0.0.1:4003:4003"
    env_file: ./services/documents/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/documents
    secrets:
      - source: vault_token_documents
        target: vault_token
    depends_on: [postgres, rabbitmq, minio, vault]
    networks: [zu-network]
    restart: unless-stopped

  media:
    build:
      context: ./services/media
      dockerfile: Dockerfile
    container_name: zu-media
    ports:
      - "127.0.0.1:4004:4004"
    env_file:
      - ./services/media/.env.dev
      # Secretos: Vault (secret/zu360/<servicio>), nunca en archivos del repo.
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/media
      S3_PUBLIC_ENDPOINT: "http://localhost:9000"
    secrets:
      - source: vault_token_media
        target: vault_token
    depends_on: [minio, rabbitmq, vault]
    networks: [zu-network]
    restart: unless-stopped

  mail:
    build:
      context: ./services/mail
      dockerfile: Dockerfile
    container_name: zu-mail
    ports:
      - "127.0.0.1:4005:4005"
    env_file: ./services/mail/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/mail
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      FROM_EMAIL: noreply@zuseguridad360.com
    secrets:
      - source: vault_token_mail
        target: vault_token
    depends_on: [rabbitmq, vault, mailpit]
    networks: [zu-network]
    restart: unless-stopped

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    container_name: zu-notifications
    ports:
      - "127.0.0.1:4006:4006"
    env_file: ./services/notifications/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/notifications
    secrets:
      - source: vault_token_notifications
        target: vault_token
    depends_on: [rabbitmq, redis, vault]
    networks: [zu-network]
    restart: unless-stopped

  autopilot:
    build:
      context: ./services/autopilot
      dockerfile: Dockerfile
    container_name: zu-autopilot
    ports:
      - "127.0.0.1:4007:4007"
    env_file: ./services/autopilot/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/autopilot
      AUTOPILOT_ENABLED: "false"
    secrets:
      - source: vault_token_autopilot
        target: vault_token
    depends_on: [postgres, rabbitmq, redis, vault]
    networks: [zu-network]
    restart: unless-stopped

  attention:
    build:
      context: ./services/attention
      dockerfile: Dockerfile
    container_name: zu-attention
    ports:
      - "127.0.0.1:4008:4008"
    env_file:
      - ./services/attention/.env.dev
      # Secretos: Vault (secret/zu360/<servicio>), nunca en archivos del repo.
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/attention
    secrets:
      - source: vault_token_attention
        target: vault_token
    depends_on: [postgres, redis, vault]
    networks: [zu-network]
    restart: unless-stopped

  onboarding:
    build:
      context: ./services/onboarding
      dockerfile: Dockerfile
    container_name: zu-onboarding
    ports:
      - "127.0.0.1:4009:4009"
    env_file: ./services/onboarding/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/onboarding
    secrets:
      - source: vault_token_onboarding
        target: vault_token
    depends_on: [postgres, rabbitmq, vault]
    networks: [zu-network]
    restart: unless-stopped

  billing:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    container_name: zu-billing
    ports:
      - "127.0.0.1:4010:4010"
    env_file:
      - ./services/billing/.env.dev
      # Secretos: Vault (secret/zu360/<servicio>), nunca en archivos del repo.
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/billing
      AUTO_MIGRATE: "false"
    secrets:
      - source: vault_token_billing
        target: vault_token
    depends_on: [postgres, rabbitmq, vault]
    networks: [zu-network]
    restart: unless-stopped

  sla:
    build:
      context: ./services/sla
      dockerfile: Dockerfile
    container_name: zu-sla
    ports:
      - "127.0.0.1:4011:4011"
    env_file: ./services/sla/.env.dev
    environment:
      <<: *vault-env
      VAULT_SECRET_PATH: secret/data/zu360/sla
      SLA_INSPECTION_REVIEW_MINUTES: "4320"
    secrets:
      - source: vault_token_sla
        target: vault_token
    depends_on: [postgres, redis, vault]
    networks: [zu-network]
    restart: unless-stopped

  drone:
    profiles: ["high-risk"]
    build:
      context: ./services/drone
      dockerfile: Dockerfile
    container_name: zu-drone
    ports:
      - "127.0.0.1:4012:4012"
    env_file: ./services/drone/.env.dev
    environment:
      DRONE_ENABLED: "false"
    depends_on: [postgres, emqx, redis]
    networks: [zu-network]

secrets:
  vault_token_mail:
    file: ./secrets/vault/mail.token
  vault_token_notifications:
    file: ./secrets/vault/notifications.token
  vault_token_sla:
    file: ./secrets/vault/sla.token
  vault_token_onboarding:
    file: ./secrets/vault/onboarding.token
  vault_token_autopilot:
    file: ./secrets/vault/autopilot.token
  vault_token_documents:
    file: ./secrets/vault/documents.token
  vault_token_core:
    file: ./secrets/vault/core.token
  vault_token_billing:
    file: ./secrets/vault/billing.token
  vault_token_attention:
    file: ./secrets/vault/attention.token
  vault_token_media:
    file: ./secrets/vault/media.token
  vault_token_ai:
    file: ./secrets/vault/ai.token
